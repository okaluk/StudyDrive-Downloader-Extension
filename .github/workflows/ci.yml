name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Build all targets
        run: npm run zip:all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: extension-zips
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dotted dir; upload-artifact skips hidden paths otherwise.
          include-hidden-files: true
