name: Publish

# Publishes to the Chrome Web Store, Firefox Add-ons (AMO) and Edge Add-ons.
# Triggered by pushing a version tag, e.g.:
#   git tag v2.1.0 && git push origin v2.1.0
# Or manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Build & zip all targets
        run: npm run zip:all

      # WXT names zips with the version (e.g. ...-2.0.0-chrome.zip).
      # Normalize to stable filenames so the publish step is version-agnostic.
      - name: Normalize zip names
        run: |
          cd .output
          cp *-chrome.zip chrome.zip
          cp *-firefox.zip firefox.zip
          cp *-edge.zip edge.zip
          cp *-sources.zip sources.zip

      # Publishes to all three stores in one step.
      # Requires the BPP_KEYS repository secret (see docs/publishing.md).
      - name: Publish to stores
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.BPP_KEYS }}
          chrome-file: .output/chrome.zip
          firefox-file: .output/firefox.zip
          firefox-sources-file: .output/sources.zip
          edge-file: .output/edge.zip
          verbose: true
