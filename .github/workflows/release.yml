name: Release

# Builds the extension for all browsers and publishes the zips as a GitHub Release.
# Triggered by pushing a version tag, e.g.:
#   git tag v2.1.0 && git push origin v2.1.0
# Or manually from the Actions tab (pick a tag via workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Build & zip all targets
        run: npm run zip:all

      # WXT names zips with the version (e.g. ...-2.0.0-chrome.zip).
      # Normalize to browser-named files for the release assets.
      - name: Normalize zip names
        run: |
          cd .output
          cp *-chrome.zip studydrive-downloader-chrome.zip
          cp *-firefox.zip studydrive-downloader-firefox.zip
          cp *-edge.zip studydrive-downloader-edge.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            .output/studydrive-downloader-chrome.zip
            .output/studydrive-downloader-firefox.zip
            .output/studydrive-downloader-edge.zip
